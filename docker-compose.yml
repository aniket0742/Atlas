# Local development infrastructure for Atlas.
#
# Phase 1 needs Postgres only. Redis is here because Phase 3 (async ingestion)
# and Phase 6 (caching) need it, and running it now costs ~10MB of RAM.
name: atlas

services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Brings GEMINI_API_KEY and the tuning values in from your .env. Marked
    # optional so `docker compose up` still works on a fresh clone before you
    # have made one -- the app then starts and fails only on the first query,
    # which is a clearer error than compose refusing to start.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides whatever .env says. Inside the compose network the database
      # is reachable as "postgres", never as localhost -- localhost in a
      # container is the container itself.
      ATLAS_DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      # Named volume, so the ~67MB ONNX model is downloaded once and survives
      # image rebuilds.
      ATLAS_MODEL_CACHE_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - atlas_models:/models
      # Source is bind-mounted over the editable install so code and UI edits
      # take effect on restart without an image rebuild. Local development
      # convenience only; a deployment image would not do this.
      - ./src:/app/src
      - ./eval:/app/eval:ro
    # Migrations run before the server accepts traffic. Safe to repeat: the
    # runner is idempotent and records what it has applied.
    command: >
      sh -c "atlas migrate &&
             uvicorn atlas.api.app:app --host 0.0.0.0 --port 8000"

  worker:
    # Same image as the API, different entry point. Ingestion is CPU-bound on
    # embedding while the API is mostly waiting on the model provider, so
    # separating them means a large upload cannot starve query traffic -- which
    # is the operational reason for the queue, beyond just not blocking the
    # request.
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ATLAS_DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      ATLAS_MODEL_CACHE_DIR: /models
    volumes:
      # Shares the model volume with the API so the embedding model is
      # downloaded once, not once per service.
      - atlas_models:/models
      - ./src:/app/src
      - ./eval:/app/eval:ro
    # No migrate here: the API service owns schema application, and two
    # containers racing to apply migrations on startup is a needless hazard.
    command: ["atlas", "worker"]
    # The image's HEALTHCHECK probes http://localhost:8000/health, which exists
    # only in the API. Inheriting it here would mark a perfectly healthy worker
    # unhealthy forever. Disabled rather than faked: liveness for the worker is
    # visible in queue depth and oldest-pending age, which is the signal that
    # actually matters.
    healthcheck:
      disable: true
    # SIGTERM lets the worker finish the job in flight before exiting. Killing
    # it mid-job is survivable -- the lease expires and the reaper requeues --
    # but it wastes the embedding work already done.
    stop_signal: SIGTERM
    stop_grace_period: 60s
    restart: unless-stopped

  postgres:
    # pgvector ships prebuilt images tracking upstream Postgres releases.
    # Pinned by digest-less tag on purpose: we want patch updates, not major ones.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
      # Deterministic collation so ORDER BY and text comparisons are stable
      # across machines. Matters for reproducible eval runs.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # appendonly: ingestion job state must survive a container restart once
    # Phase 3 lands. Harmless now.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - atlas_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  atlas_pgdata:
  atlas_redisdata:
  atlas_models:
